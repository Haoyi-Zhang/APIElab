name: Scientific checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete finite campaign in fresh runner output
        run: python -B -m compatibility.scientific_checks --output "$RUNNER_TEMP/apielab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain command logs and raw scientific results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apielab-scientific-results
          path: ${{ runner.temp }}/apielab-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
